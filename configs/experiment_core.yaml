# Confirmatory attribution pass. Same frozen LightGCN. No BPR grid, no retrained K.
# Use this first: it is the estimand (one checkpoint × 5 seeds × 2 graphs).
# Run configs/experiment.yaml afterwards for RQ2 architecture control + BPR listed effort.
profile: scientific
run_name: scientific_core
seeds: [0, 1, 2, 3, 4]
datasets: [ml1m, beauty]
device: auto
neg_pool: heldout_excluded
cutoff: 10
cutoffs: [5, 10, 20]
n_negatives: 1
lightgcn:
  K: 3
  d: 64
  lr: 1.0e-3
  reg: 1.0e-4
  patience: 20
  max_epochs: 1000
  eval_every: 5
eval_every: 5
bpr_max_epochs: 1000
bpr_patience: 20
stability_floor: 0.005
flag_relative_tol: 0.15
game_b_margin: 0.05
adaptive_beta: 0.25
beauty_user_floor: 1000
retrained_k: [1, 2, 3, 4]
n_val_alpha: 286
run_bpr_grid: false
run_retrained_k: false
run_game_b_if_triggered: true
allow_missing_sha256: false
checkpoint_every_epoch: false
